name: Refresh league results

on:
  schedule:
    - cron: '*/10 8-21 * * 6,0'
    - cron: '*/30 8-21 * * 1-5'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ask BetterKDUL to refresh if due
        run: |
          curl -fsS -m 90 -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://www.betterkdul.ie/api/refresh?all=1"
